services:
  api:
    build:
      context: ./backend
    container_name: amazonhelp-api
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: amazonhelp-frontend
    ports:
      - "5500:80"
    depends_on:
      - api
    restart: unless-stopped